<!DOCTYPE html>
<html>
    <head>
        <title>Enlaces</title>
    </head>
    <body>
        <h1>Enlaces</h1>
        <!--Para escribir enlaces usamos la etiqueta <a> y el atributo ´href´, quedaria de esta forma <a href="//link>Nombre del enlace</a>"-->
        <!--Para poner enlaces podemos poner `https://link` o directamente ´//link´-->
            <a href="//YouTube.com">YouTube</a>
        <h2>Enlaces con target y atributo title</h2>
        <!--Si queremos que se abra en otra pestaña debemos usar el atributo `target="_blank", por defecto viene target="_self"`-->
        <!--Si queremos que nos aparezca una pequeña descripcion cuando pongamos el raton encima de un elemento usamos el atributo `title`-->
            <a href="/html/3 Enlaces/3 Enlaces2.html" target="_blank" title="Abrir enlace 2">Enlaces 2</a>
            <a href="/html/3 Enlaces/3 Enlaces3.html" target="_blank" title="Abrir enlace 3">Enlaces 3</a>
    </body>
</html>
