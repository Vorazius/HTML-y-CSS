<!DOCTYPE html>
<html>
    <head>
        <title>Imagenes</title>
    </head>
    <body>
        <h1>Imagenes</h1>
        <!--Para poner una imagen usamos la etiqueta <img> con el atributo `src`, quedaria de esta forma (<img src="imagen.png">)-->
        <!--Si la imagen no cargara podemos poner el atributo `alt`, que se trata de una pequeña descripción de la imagen-->
        <img src="/html/Imagenes/Luffy One Piece.jpg" alt="Imagen de Luffy">
    </body>
</html>
